<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>도서관 안내 Agent · Workflow Studio</title>
  <link rel="stylesheet" href="./studio-shell.css">
  <link rel="stylesheet" href="./studio-canvas.css">
</head>
<body>
<div id="app-shell">
  <aside class="sidebar" id="workspace-nav" aria-label="워크스페이스 탐색">
    <div class="brand">
      <span class="brand-mark"><i data-icon="workflow"></i></span>
      <div><strong>Workflow Studio</strong><small>AI Agent 설계 작업대</small></div>
    </div>
    <nav aria-label="프로젝트 메뉴">
      <section class="nav-group"><h2>작업</h2>
        <button class="nav-item" data-action="templates"><i data-icon="home"></i>홈</button>
        <button class="nav-item current" data-action="edit" aria-current="page"><i data-icon="workflow"></i>Workflow 설계</button>
        <button class="nav-item" data-action="projects"><i data-icon="folder"></i>내 Agent</button>
        <button class="nav-item" data-action="resources"><i data-icon="file"></i>도구 및 자료</button>
      </section>
      <section class="nav-group"><h2>공유</h2>
        <button class="nav-item" data-action="shared"><i data-icon="users"></i>공유 Agent</button>
        <button class="nav-item" data-action="share"><i data-icon="link"></i>내 공유 설정</button>
      </section>
      <section class="nav-group"><h2>예제</h2>
        <button class="nav-item" data-action="templates"><i data-icon="book"></i>수준별 템플릿</button>
        <button class="nav-item" data-action="resources"><i data-icon="library"></i>예시 자료</button>
      </section>
      <section class="nav-group"><h2>지원</h2>
        <button class="nav-item" data-action="guide"><i data-icon="help"></i>가이드</button>
      </section>
    </nav>
    <div class="sidebar-footer"><i data-icon="layers"></i>로컬 워크스페이스</div>
  </aside>
  <main class="workspace">
    <header class="workspace-header">
      <div class="breadcrumb">
        <span class="crumb-parent">내 워크스페이스</span><span class="crumb-divider">/</span><strong>Workflow 설계</strong>
      </div>
      <nav class="panel-links" aria-label="편집 영역 바로가기">
        <a href="#block-palette">블록 추가</a><a href="#canvas-panel">캔버스</a><a href="#props-panel">속성</a>
      </nav>
    </header>
    <section class="editor-toolbar" aria-label="프로젝트 작업">
      <div class="identity-row">
        <h1 id="project-title">도서관 안내 Agent</h1>
        <button class="workflow-picker" id="template" aria-label="수준별 템플릿 과제 보기"><i data-icon="workflow"></i><span>입문 Workflow</span><i data-icon="chevron"></i></button>
        <span id="save-badge" class="save-badge">작업 초안</span>
      </div>
      <div class="action-row">
        <div class="edit-actions">
          <div class="history-pair">
            <button class="bare" data-action="undo" title="실행 취소" aria-label="실행 취소"><i data-icon="undo"></i></button>
            <button class="bare" data-action="redo" title="다시 실행" aria-label="다시 실행"><i data-icon="redo"></i></button>
          </div>
          <button id="save"><i data-icon="save"></i>저장</button>
          <button id="versions"><i data-icon="version"></i>버전</button>
          <button id="share" class="bare" title="공유" aria-label="공유"><i data-icon="share"></i></button>
        </div>
        <div class="design-actions">
          <button id="guide"><i data-icon="info"></i>만들며 배우기</button>
          <button id="validate"><i data-icon="shield"></i>설계 검사</button>
          <button data-action="export"><i data-icon="export"></i>내보내기</button>
          <button id="run" class="primary"><i data-icon="play"></i>예시 실행</button>
        </div>
      </div>
    </section>
    <div class="workbench">
      <aside class="palette" id="block-palette" aria-labelledby="palette-title" tabindex="-1">
        <h2 id="palette-title">블록 추가</h2>
        <label class="search-box"><i data-icon="search"></i><input id="palette-search" type="search" placeholder="블록 이름 검색" aria-label="블록 이름 검색"></label>
        <div class="palette-tabs" role="group" aria-label="표시할 블록">
          <button id="palette-basic" data-action="palette-basic" aria-pressed="true">기본</button>
          <button id="palette-all" data-action="palette-all" aria-pressed="false">전체 42종</button>
          <button id="palette-favorites" data-action="palette-favorites" aria-pressed="false" title="즐겨찾기" aria-label="즐겨찾기 블록"><i data-icon="star"></i></button>
        </div>
        <select id="palette-category" aria-label="블록 카테고리"><option value="">모든 카테고리</option></select>
        <div class="palette-list" id="palette-list"></div>
      </aside>
      <section class="canvas-area" id="canvas-panel" aria-labelledby="canvas-title" tabindex="-1">
        <div class="canvas-topbar"><h2 id="canvas-title">캔버스</h2>
          <div class="canvas-actions">
            <button id="arrange"><i data-icon="grid"></i><span>자동 정렬</span></button>
            <button id="list-mode" aria-pressed="false"><i data-icon="list"></i><span>목록으로 편집</span></button>
          </div>
        </div>
        <div id="graph-root"></div>
      </section>
      <aside class="inspector-pane" id="props-panel" aria-label="속성 패널" tabindex="-1">
        <div id="inspector"></div>
      </aside>
    </div>
    <footer class="status-bar" aria-label="작업 상태"><span class="status-message"><i data-icon="info"></i><span id="status-text" role="status">도서관 안내 Workflow</span></span><span id="status-count"></span></footer>
  </main>
</div>
<dialog id="studio-dialog" aria-labelledby="dialog-title">
  <header class="dialog-heading"><h2 id="dialog-title"></h2><button class="bare" data-action="close-dialog" aria-label="닫기"><i data-icon="close"></i></button></header>
  <div id="dialog-body"></div>
</dialog>
<script>
  (() => {
    const paths = {
      workflow:'<rect x="2" y="3" width="8" height="8" rx="2"/><rect x="14" y="13" width="8" height="8" rx="2"/><path d="M6 11v3a3 3 0 0 0 3 3h5"/>',
      home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
      folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      file:'<path d="M14 2H5v20h14V7z"/><path d="M14 2v5h5M8 12h8M8 16h6"/>',
      library:'<path d="M4 4v16M8 4v16M12 5v15m3-15 5 14"/>',
      users:'<circle cx="9" cy="7" r="3"/><path d="M2 20v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M17 4a3 3 0 0 1 0 6m2 4a4 4 0 0 1 3 4v2"/>',
      link:'<path d="m10 13 4-4m-5 1-3 3a3.5 3.5 0 0 0 5 5l3-3m-1-2 3-3a3.5 3.5 0 0 0-5-5l-3 3"/>',
      book:'<path d="M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v15"/>',
      help:'<circle cx="12" cy="12" r="9.5"/><path d="M9.3 9a2.7 2.7 0 0 1 5.4 0c0 2-2.7 2.4-2.7 4.2m0 3.1v.1"/>',
      layers:'<path d="m12 3 10 5-10 5L2 8zM2 12l10 5 10-5M2 16l10 5 10-5"/>',
      menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',
      undo:'<path d="m8 4-5 5 5 5M3 9h12a5 5 0 0 1 0 10h-2"/>',
      redo:'<path d="m16 4 5 5-5 5m5-5H9a5 5 0 0 0 0 10h2"/>',
      save:'<path d="M3 3h14l4 4v14H3z"/><path d="M7 3v6h9V3M7 21v-8h10v8"/>',
      version:'<rect x="8" y="6" width="12" height="15" rx="2"/><path d="M16 6V3H5a2 2 0 0 0-2 2v11h5"/>',
      share:'<circle cx="18" cy="5" r="3"/><circle cx="5" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8 11 7-5M8 13l7 5"/>',
      play:'<path d="m6 3 15 9-15 9z"/>',check:'<path d="m4 12 5 5L20 6"/>',
      shield:'<path d="m12 2 8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5z"/><path d="m8 12 3 3 5-6"/>',
      grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
      list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1"/>',
      plus:'<path d="M12 4v16M4 12h16"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',
      chevron:'<path d="m6 9 6 6 6-6"/>',
      bot:'<rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M9 12v2m6-2v2M2 11v5m20-5v5"/>',
      input:'<path d="M11 2h5l4 4v15H7v-5m4-14H7v6m8-6v5h5M2 12h11m-4-4 4 4-4 4"/>',
      output:'<path d="M10 2h6l4 4v15H7v-5M10 2H7v5m8-5v5h5M2 12h11m-7-4-4 4 4 4"/>',
      resource:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',
      condition:'<rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="16" width="6" height="6" rx="1.5"/><circle cx="18" cy="11" r="3"/><path d="M6 9v7m3-10h3q3 0 4 3"/>',
      end:'<rect x="4" y="4" width="16" height="16" rx="2"/>',
      trash:'<path d="M3 6h18m-14 0 1 15h8l1-15M9 6V3h6v3m-4 4v7m3-7v7"/>',
      copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',
      star:'<path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>',
      sliders:'<path d="M3 7h6m4 0h8M3 17h10m4 0h4"/><circle cx="11" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>',
      info:'<circle cx="12" cy="12" r="9.5"/><path d="M12 11v5m0-9v.1"/>',
      export:'<path d="M12 16V3m-5 5 5-5 5 5M3 14v6h18v-6"/>'
    };
    paths.agent = paths.bot;
    paths.start = paths.play;
    paths.review = paths.shield;
    window.StudioIcon = (name, size = 16) => {
      const length = Number(size) || 16;
      return '<svg class="studio-icon" aria-hidden="true" focusable="false" width="'+length+'" height="'+length+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+(paths[name] || paths.workflow)+'</svg>';
    };
    for (const target of document.querySelectorAll('[data-icon]')) target.innerHTML = window.StudioIcon(target.dataset.icon);
  })();
</script>
<script src="./studio-canvas.js"></script>
<script src="./studio-blocks.js"></script>
<script src="./studio-app.js"></script>
</body>
</html>
