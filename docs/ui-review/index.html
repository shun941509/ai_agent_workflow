const captures = document.querySelectorAll('.capture');
function setFocusTargets() {
  for (const capture of captures) {
    capture.tabIndex = capture.scrollWidth > capture.clientWidth ? 0 : -1;
  }
}
const resize = new ResizeObserver(setFocusTargets);
for (const capture of captures) resize.observe(capture);
document.addEventListener('change', setFocusTargets);
setFocusTargets();
</script></body></html>
